<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Dados CMAA - Atendimento</title>
    <!-- Fonte profissional -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    
    <!-- Lib para leitura do QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* --- TEMA ESCURO (CMAA) --- */
        :root {
            --primary-color: #0d1117; 
            --green-dark: #1b853a;   
            --green-mid: #68c067;    
            --green-light: #b0d995;  
            --accent-gradient: linear-gradient(90deg, var(--green-light) 0%, var(--green-mid) 50%, var(--green-dark) 100%);
            --text-on-dark: #f0f6fc;
            --input-background: #161b22;
            --card-background: #1e242d;
            --success-color: #2ea44f;
            --error-color: #cb2431;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--primary-color);
            color: var(--text-on-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            transition: all 0.3s ease;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background-color: var(--card-background);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            border-radius: 12px 12px 0 0;
            background: var(--accent-gradient);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-img {
            max-width: 220px;
            height: auto;
        }

        .logo-header {
            height: 40px;
            width: auto;
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            color: var(--green-light);
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .header-user {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(240, 246, 252, 0.1);
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #aaa;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background-color: var(--input-background);
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 8px;
            color: var(--text-on-dark);
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--green-mid);
            box-shadow: 0 0 10px rgba(104, 192, 103, 0.3);
        }

        input::placeholder, textarea::placeholder {
            color: rgba(240, 246, 252, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .input-group-qr {
            display: flex;
            gap: 10px;
        }

        .btn-qr-scan {
            background-color: var(--input-background);
            border: 1px solid var(--green-mid);
            color: var(--green-light);
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-qr-scan:hover {
            background-color: var(--green-mid);
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: var(--accent-gradient);
            background-size: 200% 100%;
            background-position: left center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(27, 133, 58, 0.4);
            background-position: right center;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-logout {
            background-color: transparent;
            color: #ccc;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }

        .btn-logout:hover {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .feedback-message {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            margin-top: 5px;
        }

        .message-error {
            background-color: rgba(203, 36, 49, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .message-success {
            background-color: rgba(46, 164, 79, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        /* --- MODAL DO QR CODE --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-background);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #reader {
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="container">
        <div class="logo-container">
            <img src="CMAA.png" alt="Logo CMAA" class="logo-img">
        </div>
        <h2>Acesso Restrito: Área de Dados</h2>
        
        <div class="form-group">
            <label for="username">Usuário (E-mail)</label>
            <input type="text" id="username" placeholder="seu.usuario@cmaa.com.br">
        </div>
        
        <div class="form-group">
            <label for="password">Senha (Numérica)</label>
            <input type="password" id="password" placeholder="Digite apenas números">
        </div>
        
        <div id="login-message" class="feedback-message"></div>
        
        <button id="login-btn" class="btn-submit">
            <span id="login-spinner" class="loading-spinner"></span>
            ACESSAR PORTAL
        </button>
    </div>

    <!-- TELA DE REGISTRO DE ATENDIMENTO -->
    <div id="ticket-screen" class="container" style="display: none;">
        <div class="header-user">
            <img src="CMAA.png" alt="Logo CMAA" class="logo-header">
            <div>
                <span id="user-greeting" style="font-weight: 500; font-size: 0.95rem; margin-right: 10px;"></span>
                <button id="logout-btn" class="btn-logout">Sair</button>
            </div>
        </div>

        <h2>Registro de Atendimento</h2>

        <form id="ticket-form">
            <div class="form-group">
                <label for="ticket_registration">Matrícula (7 a 9 dígitos)</label>
                <div class="input-group-qr">
                    <input type="text" id="ticket_registration" maxlength="9" placeholder="Ex: 12345678" required>
                    <button type="button" id="start-qr-btn" class="btn-qr-scan" title="Escanear QR Code">📷 QR</button>
                </div>
            </div>

            <div class="form-group">
                <label for="ticket_name">Nome Completo</label>
                <input type="text" id="ticket_name" placeholder="Nome do cliente/beneficiário" required>
            </div>

            <div class="form-group">
                <label for="ticket_request_type">Tipo de Solicitação</label>
                <select id="ticket_request_type" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Dúvidas">Dúvidas</option>
                    <option value="Reclamação">Reclamação</option>
                    <option value="Consulta de Protocolo/Atendimento Pendente">Consulta de Protocolo/Atendimento</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ticket_description">Descrição / Tratativa</label>
                <textarea id="ticket_description" placeholder="Detalhes da tratativa..." required></textarea>
            </div>

            <div class="form-group">
                <label for="ticket_status">Status</label>
                <select id="ticket_status" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Resolvido">Resolvido</option>
                    <option value="Pendente">Pendente</option>
                </select>
            </div>

            <div id="ticket-message" class="feedback-message"></div>

            <button type="submit" id="submit-ticket-btn" class="btn-submit">
                <span id="ticket-spinner" class="loading-spinner"></span>
                REGISTRAR ATENDIMENTO
            </button>
        </form>
    </div>

    <!-- MODAL CAMERA QR CODE -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--green-light);">Escanear QR Code</h3>
            <div id="reader"></div>
            <button id="close-qr-btn" class="btn-logout" style="margin-top: 15px; width: 100%;">Fechar Câmera</button>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        const LOGIN_API_URL = "https://0cbbf36298f0e42e8f72ebb373f876.e6.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/13c4ca7aceb94a08bb90658d07fa1141/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xtil9ZxsyJtRpn4IQnOr60f5DEgRecU4kzNSA9q3pug";
        const CREATE_TICKET_API_URL = "https://0cbbf36298f0e42e8f72ebb373f876.e6.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/21/workflows/b15b2903cfdd4cedbc84ba98b0e4b9f1/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=iYLgTU7LcGHFro5WNJsRAKoHiwwNfaey3MKvmbfaf64";

        let currentUser = null;
        let html5QrCode = null;

        // --- LÓGICA DE LOGIN ---
        document.getElementById('login-btn').addEventListener('click', async function() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordRaw = document.getElementById('password').value.trim();
            const btn = document.getElementById('login-btn');
            const spinner = document.getElementById('login-spinner');
            const messageDiv = document.getElementById('login-message');

            messageDiv.className = 'feedback-message';
            messageDiv.style.display = 'none';

            if (!usernameInput || !passwordRaw) {
                showFeedback(messageDiv, 'Preencha o nome de usuário e a senha.', 'error');
                return;
            }

            const passwordInt = parseInt(passwordRaw, 10);

            if (isNaN(passwordInt)) {
                showFeedback(messageDiv, 'A senha deve conter apenas números inteiros.', 'error');
                return;
            }

            const loginData = {
                username: usernameInput,
                password: passwordInt
            };

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btn.lastChild.textContent = ' Autenticando...';

            try {
                const response = await fetch(LOGIN_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                if (response.ok || response.status === 200 || response.status === 202) {
                    currentUser = usernameInput;
                    showTicketScreen(currentUser);
                } else if (response.status === 400) {
                    showFeedback(messageDiv, 'Usuário ou senha incorretos (Erro 400).', 'error');
                } else {
                    showFeedback(messageDiv, `Erro ao autenticar. Código de resposta: ${response.status}`, 'error');
                }

            } catch (error) {
                console.error('Erro no login:', error);
                showFeedback(messageDiv, 'Erro ao comunicar com a API de autenticação.', 'error');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btn.lastChild.textContent = 'ACESSAR PORTAL';
            }
        });

        // --- MUDANÇA DE TELA E LOGOUT ---
        function showTicketScreen(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ticket-screen').style.display = 'flex';
            document.getElementById('user-greeting').textContent = `Olá, ${user.split('@')[0]}`;
        }

        document.getElementById('logout-btn').addEventListener('click', function() {
            currentUser = null;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            const messageDiv = document.getElementById('ticket-message');
            messageDiv.style.display = 'none';

            document.getElementById('ticket-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        });

        // Restringe entrada de texto no campo Matrícula aceitando apenas dígitos
        document.getElementById('ticket_registration').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });

        // Esconde mensagens de feedback quando o usuário recomeçar a digitar
        document.getElementById('ticket-form').addEventListener('input', function() {
            const messageDiv = document.getElementById('ticket-message');
            if (messageDiv.style.display === 'block') {
                messageDiv.style.display = 'none';
            }
        });

        // --- LÓGICA DE LEITURA DO QR CODE ---
        const qrModal = document.getElementById('qr-modal');
        const startQrBtn = document.getElementById('start-qr-btn');
        const closeQrBtn = document.getElementById('close-qr-btn');

        startQrBtn.addEventListener('click', () => {
            qrModal.style.display = 'flex';
            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" }, 
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText) => {
                    const cleanCode = decodedText.replace(/\D/g, '');
                    document.getElementById('ticket_registration').value = cleanCode;
                    stopScanner();
                },
                (errorMessage) => {
                    // Ignora erros de varredura normais enquanto busca um código
                }
            ).catch(err => {
                alert('Erro ao acessar a câmera. Verifique se deu permissão de acesso.');
                stopScanner();
            });
        });

        closeQrBtn.addEventListener('click', stopScanner);

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    qrModal.style.display = 'none';
                }).catch(err => {
                    qrModal.style.display = 'none';
                });
            } else {
                qrModal.style.display = 'none';
            }
        }

        // --- LÓGICA DE CRIAÇÃO DO ATENDIMENTO ---
        document.getElementById('ticket-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const registrationInput = document.getElementById('ticket_registration').value.trim();
            const nameInput = document.getElementById('ticket_name').value.trim();
            const requestTypeInput = document.getElementById('ticket_request_type').value;
            const descriptionInput = document.getElementById('ticket_description').value.trim();
            const statusInput = document.getElementById('ticket_status').value;
            
            const btn = document.getElementById('submit-ticket-btn');
            const spinner = document.getElementById('ticket-spinner');
            const messageDiv = document.getElementById('ticket-message');

            messageDiv.className = 'feedback-message';
            messageDiv.style.display = 'none';

            // Validação explícita da quantidade de dígitos da Matrícula (entre 7 e 9)
            if (registrationInput.length < 7 || registrationInput.length > 9) {
                showFeedback(messageDiv, 'A matrícula deve conter entre 7 e 9 dígitos numéricos.', 'error');
                return;
            }

            const ticketData = {
                matricula: registrationInput,
                nome: nameInput,
                tipo_solicitacao: requestTypeInput,
                descricao_tratativa: descriptionInput,
                status: statusInput,
                usuario_registro: currentUser,
                data_solicitacao: new Date().toISOString()
            };

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btn.lastChild.textContent = ' Registrando...';

            try {
                const response = await fetch(CREATE_TICKET_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ticketData)
                });

                if (response.ok || response.status === 200 || response.status === 202) {
                    showFeedback(messageDiv, '✅ Atendimento registrado com sucesso!', 'success');
                    document.getElementById('ticket-form').reset();
                } else {
                    showFeedback(messageDiv, `❌ Não foi possível registrar o atendimento. Código de erro: ${response.status}`, 'error');
                }

            } catch (error) {
                console.error('Erro no envio:', error);
                showFeedback(messageDiv, '❌ Erro de conexão com o servidor. Verifique a rede e tente novamente.', 'error');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btn.lastChild.textContent = 'REGISTRAR ATENDIMENTO';
            }
        });

        function showFeedback(element, message, type) {
            element.textContent = message;
            element.className = `feedback-message message-${type}`;
            element.style.display = 'block';
        }
    </script>
</body>
</html>
